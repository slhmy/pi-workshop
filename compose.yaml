name: pi-workshop

services:
  pi-workshop:
    image: ghcr.io/slhmy/pi-workshop:latest
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - pi_data:/agent-data
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pi_data:
